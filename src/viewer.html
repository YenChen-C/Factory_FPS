<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>S1.8 角色與武器模型檢視</title><style>body{margin:0;background:#c6ccd0;font:15px system-ui}#ui{position:fixed;top:16px;left:16px;background:#172634ed;color:white;padding:16px;border-radius:10px}select,button{padding:8px;margin:5px}p{margin:6px;font-size:13px}canvas{display:block}</style><div id="ui"><b>S1.8 實際程序模型</b><br><select id="asset"><option value="trump">玩家：川普低面數造型</option><option>A1</option><option>B1</option><option>C1</option><option value="pistol">P9 手槍</option><option value="rifle">AR-30 步槍</option><option value="smg">SM-24 衝鋒槍</option><option value="shotgun">SG-6 霰彈槍</option><option value="sniper">SR-5 狙擊槍</option></select><button id="turn">自動旋轉：開</button><button id="walk">動作：關</button><p>拖曳旋轉、滾輪縮放。這是實際網格，非概念圖片。</p><p id="info"></p></div><!--SCRIPTS--><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0xc6ccd0);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));document.body.appendChild(renderer.domElement);const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.01,100);scene.add(new THREE.HemisphereLight(0xffffff,0x637488,2));const key=new THREE.DirectionalLight(0xfff2db,2);key.position.set(-3,5,-4);scene.add(key);const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0xacb5bd,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.012;scene.add(floor);const models=makeGameModels(THREE);let object,actor,auto=true,moving=false,angle=.35,zoom=3.2,drag=false,targetY=.9;
function select(){if(object)scene.remove(object);const id=document.getElementById('asset').value;actor=GUNS[id]?null:models.character(id);object=actor?actor.group:models.gun(id);if(actor)actor.mount.visible=false;else{object.rotation.y=Math.PI/2;object.position.y=.8;}scene.add(object);targetY=actor?.9:.8;zoom=actor?3.2:2;let triangles=0;object.traverse(n=>{if(n.isMesh)triangles+=(n.geometry.index?n.geometry.index.count:n.geometry.attributes.position.count)/3;});document.getElementById('info').textContent=object.name+' · '+triangles+' 三角面（含掛載武器）';}select();document.getElementById('asset').onchange=select;document.getElementById('turn').onclick=e=>{auto=!auto;e.target.textContent='自動旋轉：'+(auto?'開':'關');};document.getElementById('walk').onclick=e=>{moving=!moving;e.target.textContent='動作：'+(moving?'開':'關');};renderer.domElement.onpointerdown=e=>{drag=true;renderer.domElement.setPointerCapture(e.pointerId);};renderer.domElement.onpointerup=()=>drag=false;renderer.domElement.onpointermove=e=>{if(drag)angle+=e.movementX*.008;};renderer.domElement.onwheel=e=>{e.preventDefault();zoom=Math.max(.65,Math.min(7,zoom+e.deltaY*.003));};onresize=()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();};let last=performance.now();function frame(t){requestAnimationFrame(frame);const dt=Math.min(.1,(t-last)/1000);last=t;if(auto&&!drag)angle+=dt*.3;camera.position.set(Math.sin(angle)*zoom,targetY+.35,-Math.cos(angle)*zoom);camera.lookAt(0,targetY,0);if(actor){actor.legs.forEach((l,i)=>l.rotation.x=moving?Math.sin(t*.007+i*Math.PI)*.4:0);actor.arms.forEach((a,i)=>a.rotation.x=moving?Math.sin(t*.007-i*Math.PI)*-.3:0);}renderer.render(scene,camera);}requestAnimationFrame(frame);
</script></html>
